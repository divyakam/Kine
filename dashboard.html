<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KINE — Your personal posture dashboard.">
  <title>KINE — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="splash.js" defer></script>
  <style>
    body {
      background: var(--bg-primary);
      overflow-x: hidden;
    }

    .bg-glows {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .glow-orb {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
    }

    .glow-1 {
      top: -10%;
      left: -10%;
      background: var(--accent-primary);
    }

    .glow-2 {
      bottom: -10%;
      right: -10%;
      background: var(--accent-secondary);
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: -1;
    }

    /* Premium Glass Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 32px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0;
      transform: translateY(30px);
      visibility: hidden; /* Prevent flicker before animation */
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(129, 236, 255, 0.3);
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(129, 236, 255, 0.1);
    }

    /* Zenith Hero Section */
    .dash-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      margin-bottom: 32px;
    }

    .hero-title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-primary);
    }

    .progress-ring-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring-bg {
      stroke: rgba(255, 255, 255, 0.05);
    }

    .ring-fill {
      stroke: var(--accent-primary);
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px var(--accent-primary-glow));
      transition: stroke-dashoffset 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .ring-label {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .ring-value {
      font-size: 4rem;
      font-weight: 800;
      font-family: 'Manrope', sans-serif;
      line-height: 1;
      color: #fff;
    }

    .ring-caption {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Stats Grid */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      padding: 24px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      background: rgba(129, 236, 255, 0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: var(--accent-primary);
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* AI Insight Card */
    .ai-insight-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-left: 4px solid var(--accent-primary);
    }

    .ai-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ai-header i {
      color: var(--accent-primary);
      font-size: 1.2rem;
    }

    .ai-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 12px;
      background: rgba(129, 236, 255, 0.1);
      color: var(--accent-primary);
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .ai-suggestion {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .dash-stats {
        grid-template-columns: 1fr 1fr;
      }
      .stat-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-glows">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
  </div>
  <div class="grid-overlay"></div>

  <main id="app-container">
    <div id="kine-toast-container" class="toast-container"></div>
    <section class="screen active" id="home-dashboard">
      
      <header class="dash-header">
        <div class="dash-header-left">
          <div class="avatar">U</div>
          <div class="greeting">
            <span style="opacity: 0.6; font-size: 0.9rem;">Welcome back,</span>
            <span id="user-name" style="font-size: 1.5rem; font-weight: 700; display: block;">User</span>
          </div>
        </div>
        <div class="dash-header-right">
          <button class="icon-btn" title="Battery" id="battery-btn">
            <i class="ph ph-battery-high"></i>
          </button>
        </div>
      </header>

      <!-- Zenith Hero -->
      <div class="glass-card dash-hero" id="hero-card">
        <span class="hero-title">Zenith Score</span>
        <div class="progress-ring-container">
          <svg viewBox="0 0 100 100" width="220" height="220">
            <circle class="ring-bg" cx="50" cy="50" r="45" stroke-width="5" fill="none" />
            <circle class="ring-fill" id="dashboard-zenith-ring" cx="50" cy="50" r="45" stroke-width="5" fill="none"
              stroke-dasharray="283" stroke-dashoffset="283" />
          </svg>
          <div class="ring-label">
            <span class="ring-value" id="dashboard-zenith-value">0</span>
            <span class="ring-caption" id="dashboard-zenith-status">Analyzing...</span>
          </div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="dash-stats">
        <div class="glass-card stat-card" id="stat-1">
          <div class="stat-icon"><i class="ph ph-bell-ringing"></i></div>
          <span class="stat-value" id="stat-corrections">0</span>
          <span class="stat-label">Corrections</span>
        </div>
        <div class="glass-card stat-card" id="stat-2">
          <div class="stat-icon"><i class="ph ph-fire"></i></div>
          <span class="stat-value" id="stat-streak">0</span>
          <span class="stat-label">Streak</span>
        </div>
        <div class="glass-card stat-card" id="stat-3">
          <div class="stat-icon"><i class="ph ph-hourglass-high"></i></div>
          <span class="stat-value" id="stat-wear-time">0h</span>
          <span class="stat-label">Wear Time</span>
        </div>
      </div>

      <!-- Posture Trend Chart -->
      <div class="glass-card dash-chart-card" id="chart-card" style="margin-bottom: 32px;">
        <div class="chart-header" style="margin-bottom:24px; display: flex; justify-content: space-between; align-items: center;">
          <h3 class="heading-sm" style="margin: 0;">Posture Trend</h3>
          <div class="seg-toggle" style="background: rgba(255,255,255,0.05); padding: 4px; border-radius: 12px;">
            <button class="active" style="background: var(--accent-primary); color: var(--bg-primary); padding: 6px 16px; border-radius: 8px; font-weight: 700; font-size: 0.8rem;">LIVE</button>
          </div>
        </div>
        <div class="chart-container" style="height:180px;">
          <svg id="dashboard-trend-svg" viewBox="0 0 400 160" preserveAspectRatio="none"
            style="width:100%;height:100%;">
            <defs>
              <linearGradient id="dashAreaGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--accent-primary)" stop-opacity="0.3" />
                <stop offset="100%" stop-color="var(--accent-primary)" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path class="chart-area" d="" fill="url(#dashAreaGrad)" />
            <path class="chart-line" d="" fill="none" stroke="var(--accent-primary)" stroke-width="3"
              stroke-linecap="round" />
            <g class="chart-points"></g>
          </svg>
        </div>
      </div>

      <!-- AI Insight -->
      <div class="glass-card ai-insight-card" id="ai-card">
        <div class="ai-header">
          <i class="ph ph-sparkle"></i>
          <span class="ai-badge">AI Intelligence</span>
        </div>
        <p class="ai-suggestion" id="ai-text">Initializing postural analysis engine...</p>
      </div>

    </section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="dashboard.html" class="nav-item active" data-page="dashboard"><i
        class="ph ph-house"></i><span>Home</span></a>
    <a href="live-posture.html" class="nav-item" data-page="live-posture"><i
        class="ph ph-activity"></i><span>Live</span></a>
    <a href="journey.html" class="nav-item" data-page="journey"><i class="ph ph-trophy"></i><span>Journey</span></a>
    <a href="analytics.html" class="nav-item" data-page="analytics"><i
        class="ph ph-chart-line-up"></i><span>Insights</span></a>
    <a href="settings.html" class="nav-item" data-page="settings"><i class="ph ph-gear"></i><span>Settings</span></a>
  </nav>

  <nav class="side-nav" aria-label="Main navigation">
    <div class="nav-logo">
      <div class="logo-circle">K</div><span>KINE</span>
    </div>
    <a href="dashboard.html" class="nav-item active" data-page="dashboard"><i
        class="ph ph-house"></i><span>Dashboard</span></a>
    <a href="live-posture.html" class="nav-item" data-page="live-posture"><i class="ph ph-activity"></i><span>Live
        Posture</span></a>
    <a href="journey.html" class="nav-item" data-page="journey"><i class="ph ph-trophy"></i><span>Journey</span></a>
    <a href="analytics.html" class="nav-item" data-page="analytics"><i
        class="ph ph-chart-line-up"></i><span>Analytics</span></a>
    <a href="timeline.html" class="nav-item" data-page="timeline"><i
        class="ph ph-clock-countdown"></i><span>Timeline</span></a>
    <a href="missions.html" class="nav-item" data-page="missions"><i class="ph ph-target"></i><span>Missions</span></a>
    <a href="leaderboard.html" class="nav-item" data-page="leaderboard"><i
        class="ph ph-ranking"></i><span>Leaderboard</span></a>
    <div class="nav-spacer"></div>
    <a href="settings.html" class="nav-item" data-page="settings"><i class="ph ph-gear"></i><span>Settings</span></a>
  </nav>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script src="tracker.js"></script>
  <script src="nav.js"></script>
  <script src="chart-engine.js"></script>
  <script src="ai-logic.js"></script>

  <script>
    (function () {
      KINEAuth.requireAuth();

      window.onload = function() {
        if (window.KINESplash && window.KINESplash.finished) {
          runDashboardEntrance();
        } else {
          window.addEventListener('KINESplashFinished', () => {
            runDashboardEntrance();
          });
        }
      };

      function runDashboardEntrance() {
        // Staggered Entrance
        const tl = anime.timeline({
          easing: 'easeOutExpo',
          duration: 1200
        });

        tl.add({
          targets: '.dash-header',
          opacity: [0, 1],
          translateY: [-20, 0]
        })
        .add({
          targets: '.glass-card',
          begin: (anim) => {
            // Set visibility to visible when animation starts
            document.querySelectorAll('.glass-card').forEach(el => el.style.visibility = 'visible');
          }
        }, 0)
        .add({
          targets: '#hero-card',
          opacity: [0, 1],
          translateY: [30, 0]
        }, '-=800')
        .add({
          targets: '.stat-card',
          opacity: [0, 1],
          translateY: [30, 0],
          delay: anime.stagger(150)
        }, '-=1000')
        .add({
          targets: '#chart-card',
          opacity: [0, 1],
          translateY: [30, 0]
        }, '-=1000')
        .add({
          targets: '#ai-card',
          opacity: [0, 1],
          translateY: [30, 0]
        }, '-=1000');

        // Background Glow Animation
        anime({
          targets: '.glow-orb',
          scale: [1, 1.2],
          opacity: [0.1, 0.15],
          duration: 10000,
          direction: 'alternate',
          loop: true,
          easing: 'easeInOutSine'
        });
      }

      KINEAuth.onReady(user => {
        if (!user) return;

        // 1. Profile Data
        KINEdb.onProfile(user.uid, profile => {
          if (profile) {
            const nameSpan = document.getElementById('user-name');
            const avatar = document.querySelector('.avatar');
            if (nameSpan) nameSpan.textContent = profile.name || 'User';
            if (avatar) avatar.textContent = (profile.name || 'U').charAt(0);
          }
        });

        // 2a. Real-time Device Posture Data
        let lastKnownBaseline = null;
        KINEdb.onLiveDevicePosture(deviceInfo => {
          if (!deviceInfo) return;

          if (lastKnownBaseline !== null && deviceInfo.baseline !== lastKnownBaseline) {
            showKineToast("Posture Base Set Successfully!");
          }
          lastKnownBaseline = deviceInfo.baseline;

          const statusEl = document.getElementById('dashboard-zenith-status');
          if (statusEl) {
            const score = deviceInfo.currentScore || 0;
            if (score > 85) statusEl.textContent = 'Optimal';
            else if (score > 60) statusEl.textContent = 'Fair';
            else statusEl.textContent = 'Action Needed';
          }
        });

        // 2b. Daily Average Zenith Score Listener
        KINEdb.onDailyStats(user.uid, avg => {
          const ring = document.getElementById('dashboard-zenith-ring');
          const valueEl = document.getElementById('dashboard-zenith-value');
          if (ring && valueEl) {
            const circumference = 2 * Math.PI * 45;
            const offset = circumference - (avg / 100) * circumference;
            
            // Animate value counter
            const obj = { val: parseInt(valueEl.textContent) || 0 };
            anime({
              targets: obj,
              val: avg,
              round: 1,
              duration: 1500,
              easing: 'easeOutExpo',
              update: function() {
                valueEl.textContent = obj.val;
              }
            });

            // Animate ring fill
            anime({
              targets: ring,
              strokeDashoffset: offset,
              duration: 1500,
              easing: 'easeOutExpo'
            });
          }
        });

        // 2c. Trend Chart
        KINEdb.onHistory(user.uid, historyData => {
          const svg = document.getElementById('dashboard-trend-svg');
          if (svg && historyData && window.KINE_Charts) {
            KINE_Charts.renderTrendChart('dashboard-trend-svg', historyData);
          }
        });

        // 2c. Stats & AI insights
        KINEdb.onPosture(user.uid, posture => {
          if (!posture) return;
          const updates = [
            { id: 'stat-corrections', val: posture.corrections || 0 },
            { id: 'stat-streak', val: posture.streak || 0 },
            { id: 'stat-wear-time', val: (posture.wearTime || 0).toFixed(1) + 'h', raw: posture.wearTime }
          ];

          updates.forEach(u => {
            const el = document.getElementById(u.id);
            if (el) el.textContent = u.val;
          });

          if (window.KINE_AI) {
            const insights = KINE_AI.getSlouchInsights();
            const aiText = document.getElementById('ai-text');
            if (aiText) aiText.textContent = insights.suggestion;
          }
        });

        // Helper: Toast Notifications
        function showKineToast(message) {
          const container = document.getElementById('kine-toast-container');
          if (!container) return;
          const toast = document.createElement('div');
          toast.className = 'toast';
          toast.innerHTML = `<i class="ph-bold ph-check-circle" style="color:var(--accent-primary)"></i> ${message}`;
          container.appendChild(toast);
          setTimeout(() => toast.remove(), 3500);
        }
      });
    })();
  </script>
</body>

</html>
