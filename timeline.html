  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="db.js"></script>
  <script src="tracker.js"></script>

  <script>
    (function () {
      KINEAuth.requireAuth();

      KINEAuth.onReady(user => {
        if (!user) return;

        const timelineContainer = document.querySelector('.timeline');

        KINEdb.onTimeline(user.uid, events => {
          console.log('[Timeline] Data received:', events);
          timelineContainer.innerHTML = '';

          if (!events || events.length === 0) {
            timelineContainer.innerHTML = '<p style="text-align:center;color:var(--text-muted);padding:40px;">No events logged yet.</p>';
            return;
          }

          events.forEach(event => {
            // Robust Regex Parser for "DD-MM-YYYY HH:mm:ss" or standard timestamps
            let date = new Date(event.timestamp);

            if (isNaN(date.getTime()) && typeof event.timestamp === 'string') {
              const match = event.timestamp.match(/(\d{1,2})-(\d{1,2})-(\d{4})[,\s]+(\d{1,2}):(\d{1,2}):(\d{1,2})/);
              if (match) {
                const [_, d, m, y, hh, mm, ss] = match;
                date = new Date(y, m - 1, d, hh, mm, ss);
              } else {
                const dateMatch = event.timestamp.match(/(\d{1,2})-(\d{1,2})-(\d{4})/);
                if (dateMatch) {
                  const [_, d, m, y] = dateMatch;
                  date = new Date(y, m - 1, d);
                }
              }
            }

            // Formatting
            const timeStr = isNaN(date.getTime()) ? '--:--' : date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            const dateStr = isNaN(date.getTime()) ? '' : date.toLocaleDateString([], { day: '2-digit', month: 'short' });

            const newItem = document.createElement('div');
            const isAligned = event.type === 'Good' || event.type === 'Good posture';
            newItem.className = isAligned ? 'timeline-item' : 'timeline-item bad';

            const timeSpan = document.createElement('span');
            timeSpan.className = 'tl-time';
            timeSpan.textContent = dateStr ? `${dateStr}, ${timeStr}` : 'Unknown Time';

            const textSpan = document.createElement('span');
            textSpan.className = 'tl-text';
            textSpan.textContent = `${event.type} (${(event.deviation || 0).toFixed(0)} dev)`;

            newItem.appendChild(timeSpan);
            newItem.appendChild(textSpan);
            timelineContainer.appendChild(newItem);
          });
        });
      });
    })();
  </script>
</body>
