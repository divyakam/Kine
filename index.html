<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KINE — Smart IoT posture-correcting necklace.">
  <title>KINE — Posture Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="splash.js" defer></script>
  <style>
    /* --- Landing Content --- */
    body {
      background: var(--bg-primary);
      overflow-x: hidden;
      margin: 0;
    }

    .bg-glows {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .glow-orb {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.15;
    }

    .glow-1 {
      top: -10%;
      left: -10%;
      background: var(--accent-primary);
    }

    .glow-2 {
      bottom: -10%;
      right: -10%;
      background: var(--accent-secondary);
    }

    .landing-container {
      opacity: 0;
      min-height: 100vh;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      max-width: 1300px;
      margin: 0 auto;
      padding: 64px 40px;
      gap: 40px;
      box-sizing: border-box;
    }

    .landing-left {
      flex: 1.1;
      min-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 24px;
      z-index: 10;
    }

    .landing-right {
      flex: 0.9;
      min-width: 350px;
      display: flex;
      align-items: flex-end; /* Pin to bottom */
      justify-content: center;
      position: relative;
      height: 100%; /* Fill container height */
    }

    @media (max-width: 992px) {
      .landing-container {
        flex-direction: column;
        justify-content: flex-start;
        text-align: center;
        padding-top: 80px;
      }

      .landing-left {
        align-items: center;
        flex: none;
        width: 100%;
      }

      .landing-right {
        flex: none;
        width: 100%;
        min-height: 450px;
      }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      background: rgba(129, 236, 255, 0.1);
      border: 1px solid rgba(129, 236, 255, 0.2);
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-primary);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(-20px);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .hero-title {
      font-size: clamp(3rem, 7vw, 5rem);
      line-height: 1.1;
      color: #fff;
      margin: 0;
      text-align: left;
    }

    @media (max-width: 992px) {
      .hero-title {
        text-align: center;
      }
    }

    .hero-title span {
      display: block;
      opacity: 0;
      transform: translateY(30px);
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      max-width: 540px;
      line-height: 1.6;
      opacity: 0;
      margin: 0;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transform: translateY(20px);
      margin-top: 12px;
    }

    /* Elegant & Proportionate Cards */
    .visual-core-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spine-visual {
      width: 100%;
      height: 90vh; /* Adjust height to take up most of the screen */
      object-fit: contain;
      object-position: bottom; /* Keep bottom aligned */
      filter: drop-shadow(0 0 40px var(--accent-primary-glow));
      opacity: 0;
      transform: translateY(100px); /* Initial position for JS animation */
      z-index: 5;
      transform-style: preserve-3d;
    }

    @keyframes spine-float {
      0%, 100% { transform: translateY(0) scale(0.9); }
      50% { transform: translateY(-15px) scale(0.92); }
    }

    @keyframes spine-spin {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    .data-pill {
      position: absolute;
      padding: 10px 18px;
      background: rgba(25, 27, 30, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      backdrop-filter: blur(15px);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 20;
      opacity: 0;
      white-space: nowrap;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .data-pill:hover {
      border-color: var(--accent-primary);
      background: rgba(25, 27, 30, 0.9);
      transform: translateY(-5px) scale(1.05);
    }

    .data-pill i {
      font-size: 1.1rem;
      color: var(--accent-primary);
    }

    .pill-1 {
      top: 10%;
      right: -5%;
    }

    .pill-2 {
      bottom: 20%;
      left: -10%;
    }

    .pill-3 {
      bottom: 5%;
      right: 0%;
    }

    @media (max-width: 992px) {
      .pill-1 {
        top: 10%;
        right: 5%;
      }

      .pill-2 {
        left: 5%;
      }

      .pill-3 {
        right: 5%;
      }
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: var(--accent-primary);
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border: 1px solid var(--accent-primary);
      border-radius: 50%;
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.5);
        opacity: 1;
      }

      100% {
        transform: scale(2.5);
        opacity: 0;
      }
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100px 100px;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>

<body>

  <div class="bg-glows">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
  </div>
  <div class="grid-overlay"></div>

  <main id="app-container">
    <div class="landing-container" id="landing-content">

      <section class="landing-left">
        <div class="hero-badge">
          <i class="ph ph-lightning"></i>
          <span>Precision Biometrics v1.0</span>
        </div>

        <h1 class="hero-title">
          <span class="line">Next-level</span>
          <span class="line" style="color: var(--accent-primary); font-weight: 800;">Posture</span>
          <span class="line" style="color: var(--accent-primary); font-weight: 800;">Intelligence</span>
        </h1>

        <p class="hero-subtitle">
          Experience the future of spinal wellness. Our AI-driven IoT ecosystem provides hyper-accurate, real-time
          biomechanical feedback.
        </p>

        <div class="action-group">
          <a href="intro.html" class="btn btn-primary btn-lg" style="padding: 18px 40px; border-radius: 14px;">
            <span>Get Started</span>
            <i class="ph ph-arrow-right"></i>
          </a>
        </div>
      </section>

      <section class="landing-right">
        <div class="visual-core-container">
          <!-- Anatomical Spine Visual -->
          <img src="Gemini_Generated_Image_9bztam9bztam9bzt-removebg-preview.png" class="spine-visual" id="hero-spine" alt="Anatomical Spine Model">

          <!-- Elegant Floating Cards -->
          <div class="data-pill pill-1">
            <div class="pulse-dot"></div>
            <span>98.4% Accuracy</span>
          </div>
          <div class="data-pill pill-2">
            <i class="ph ph-lightning-fill"></i>
            <span>Real-time Sync</span>
          </div>
          <div class="data-pill pill-3">
            <i class="ph ph-brain-fill" style="color: var(--accent-secondary);"></i>
            <span>AI Predictive</span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    window.onload = function () {
      try {
        // Listen for global splash completion
        window.addEventListener('KINESplashFinished', () => {
          startLandingAnimation();
        });

        function startLandingAnimation() {
          const content = document.getElementById('landing-content');
          if (!content) return;
          content.style.opacity = '1';

          const landingTimeline = anime.timeline({ easing: 'easeOutExpo' });

          landingTimeline
            .add({ targets: '.hero-badge', opacity: [0, 1], translateY: [-20, 0], duration: 1000 })
            .add({ targets: '.hero-title span', opacity: [0, 1], translateY: [30, 0], duration: 1000, delay: (el, i) => i * 200 }, '-=800')
            .add({ targets: '.hero-subtitle', opacity: [0, 1], duration: 800 }, '-=800')
            .add({ targets: '.action-group', opacity: [0, 1], translateY: [20, 0], duration: 1000 }, '-=800')
            .add({ 
              targets: '.spine-visual', 
              opacity: [0, 1], 
              translateY: ['100%', 0], 
              scale: [0.8, 1],
              duration: 2000,
              easing: 'easeOutQuart'
            }, '-=1200')
            .add({ targets: '.data-pill', opacity: [0, 1], scale: [0.8, 1], duration: 1200, delay: (el, i) => i * 150 }, '-=1000');

          // New Floating Drift Animation
          anime({
            targets: '.data-pill',
            translateX: () => anime.random(-15, 15),
            translateY: () => anime.random(-15, 15),
            rotate: () => anime.random(-2, 2),
            duration: () => anime.random(3000, 5000),
            delay: (el, i) => i * 200,
            direction: 'alternate',
            loop: true,
            easing: 'easeInOutSine'
          });

          // Suble Pulse for cards
          anime({
            targets: '.data-pill',
            boxShadow: [
              '0 10px 30px rgba(0,0,0,0.3)',
              '0 15px 45px rgba(129, 236, 255, 0.15)'
            ],
            duration: 2000,
            direction: 'alternate',
            loop: true,
            easing: 'easeInOutSine'
          });
        }
      } catch (err) {
        console.error('KINE Animation Error:', err);
        const content = document.getElementById('landing-content');
        if (content) content.style.opacity = '1';
      }
    };
  </script>

</body>

</html>
