<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KINE — Create your account to start your posture journey.">
  <title>KINE — Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app-container">
  <section class="screen active" id="sign-up">
    <div class="auth-card glass">
      <h2 class="heading-lg">Create Account</h2>
      <p class="auth-subtitle">Start your posture journey today.</p>
      <form id="signup-form">
        <div class="input-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="input-field" placeholder="Alex Johnson" required>
        </div>
        <div class="input-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" class="input-field" placeholder="alex@email.com" required>
        </div>
        <div class="input-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" class="input-field" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" id="signup-btn" class="btn btn-primary btn-block btn-lg">Sign Up</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Log In</a></p>
    </div>
  </section>
</main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>

  <script>
    document.getElementById('signup-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      const btn = document.getElementById('signup-btn');
      btn.classList.add('btn-loading');
      btn.disabled = true;

      try {
        await KINEAuth.signUp(name, email, password);
        window.location.href = 'setup.html';
      } catch (error) {
        console.error(error);
      } finally {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
