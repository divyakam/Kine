<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KINE — Tactical Live Posture Tracking.">
  <title>KINE — Live HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="splash.js" defer></script>
  <style>
    /* ============================================================
       TACTICAL HUD — LIVE POSTURE (PRESERVING CORE CONTENT)
       ============================================================ */
    body {
      background: var(--bg-primary);
      overflow: hidden;
      height: 100vh;
      color: #fff;
    }

    /* HUD Overlays */
    .hud-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      background: 
        radial-gradient(circle at center, transparent 0%, rgba(12, 14, 18, 0.4) 100%),
        repeating-linear-gradient(0deg, rgba(129, 236, 255, 0.02) 0px, transparent 1px, transparent 4px);
      background-size: 100% 100%, 100% 4px;
      opacity: 0.5;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      z-index: -1;
    }

    .dashboard-container {
      margin-left: 260px;
      height: 100vh;
      padding: 32px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* Header */
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }

    .tactical-title h1 {
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--accent-primary);
      margin-bottom: 4px;
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--text-muted);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary-glow);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    /* Main Grid */
    .hud-main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr 320px;
      align-items: center;
      gap: 32px;
    }

    /* Cards */
    .hud-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 24px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    .hud-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(129, 236, 255, 0.4);
      transform: translateY(-2px);
    }

    .card-label {
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 12px;
      display: block;
    }

    .card-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      font-family: 'Manrope', sans-serif;
    }

    /* Silhouette Core */
    .core-module {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .silhouette-container {
      width: 300px;
      height: 400px;
      position: relative;
      filter: drop-shadow(0 0 30px var(--accent-primary-glow));
      transition: all 0.4s ease;
    }

    .silhouette-svg {
      width: 100%;
      height: 100%;
    }

    .body-base {
      fill: rgba(129, 236, 255, 0.05);
      stroke: var(--accent-primary);
      stroke-width: 1.5;
    }

    .head-base {
      fill: rgba(129, 236, 255, 0.1);
      stroke: var(--accent-primary);
      stroke-width: 1.5;
    }

    .spine-line {
      stroke: var(--accent-primary);
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
      filter: drop-shadow(0 0 10px var(--accent-primary));
    }

    /* Zenith Meter HUD style */
    .status-pod {
      margin-top: 24px;
      width: 100%;
      max-width: 280px;
      text-align: center;
    }

    .status-text {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .zenith-meter {
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .zenith-fill {
      height: 100%;
      background: var(--accent-primary);
      box-shadow: 0 0 10px var(--accent-primary-glow);
      transition: width 0.5s ease;
    }

    .status-hint {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Side Nav Sync */
    .side-nav {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 260px;
      background: rgba(12, 14, 18, 0.95);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--glass-border);
      z-index: 1000;
      padding: 40px 0;
      display: flex;
      flex-direction: column;
    }

    /* States */
    .deviated .body-base, .deviated .head-base, .deviated .spine-line {
      stroke: var(--danger);
    }
    .deviated .spine-line {
      filter: drop-shadow(0 0 10px var(--danger));
    }
    .status-text.bad { color: var(--danger); }
    .is-slouching .status-dot { background: var(--danger); }

    /* ===== MOBILE RESPONSIVE ===== */
    @media (max-width: 767px) {
      .dashboard-container {
        margin-left: 0;
        height: auto;
        min-height: 100vh;
        padding: 80px 16px 40px;
        overflow-y: auto;
      }

      body { overflow: auto; height: auto; }

      .hud-header {
        flex-direction: column;
        gap: 12px;
      }

      .hud-main {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .hud-column {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .silhouette-container {
        width: 200px;
        height: 280px;
      }

      .core-module { order: -1; }

      .card-value { font-size: 1.8rem; }
    }
  </style>

</head>
<body>

  <div class="hud-overlay"></div>
  <div class="grid-overlay"></div>

  <!-- Sidebar Nav (Static) -->
  <nav class="side-nav" aria-label="Main navigation">
    <div class="nav-logo"></div>
    <a href="dashboard.html" class="nav-item" data-page="dashboard"><i class="ph-bold ph-house"></i><span>Dashboard</span></a>
    <a href="live-posture.html" class="nav-item active" data-page="live-posture"><i class="ph-bold ph-activity"></i><span>Live Posture</span></a>
    <a href="journey.html" class="nav-item" data-page="journey"><i class="ph-bold ph-trophy"></i><span>Journey</span></a>
    <a href="analytics.html" class="nav-item" data-page="analytics"><i class="ph-bold ph-chart-line-up"></i><span>Analytics</span></a>
    <a href="timeline.html" class="nav-item" data-page="timeline"><i class="ph-bold ph-clock-countdown"></i><span>Timeline</span></a>
    <a href="missions.html" class="nav-item" data-page="missions"><i class="ph-bold ph-target"></i><span>Missions</span></a>
    <a href="leaderboard.html" class="nav-item" data-page="leaderboard"><i class="ph-bold ph-ranking"></i><span>Leaderboard</span></a>
    <div class="nav-spacer"></div>
    <a href="settings.html" class="nav-item" data-page="settings"><i class="ph-bold ph-gear"></i><span>Settings</span></a>
  </nav>

  <main class="dashboard-container">
    <header class="hud-header">
      <div class="tactical-title">
        <h1>Live Posture Stream</h1>
        <div class="system-status">
          <div class="status-dot"></div>
          <span id="system-state-text">CORE SYSTEM ONLINE</span>
        </div>
      </div>
      <div class="hud-card" style="padding: 12px 24px; border-radius: 12px;">
        <span class="card-label" style="font-size: 0.55rem; margin-bottom: 4px;">Node Sync</span>
        <div style="font-size: 0.8rem; font-weight: 800; color: var(--accent-primary);">KINE-X1-SYNC</div>
      </div>
    </header>

    <div class="hud-main">
      <!-- Left Column -->
      <div class="hud-column">
        <div class="hud-card" style="margin-bottom: 24px;">
          <span class="card-label">Wear Time</span>
          <span class="card-value" id="val-wear">--h</span>
        </div>
        <div class="hud-card">
          <span class="card-label">Corrections</span>
          <span class="card-value" id="val-corrections">--</span>
        </div>
      </div>

      <!-- Central Core -->
      <div class="core-module">
        <div class="silhouette-container" id="silhouette-box">
          <svg viewBox="0 0 100 150" class="silhouette-svg">
            <path class="body-base" d="M50,30 C60,30 70,40 70,60 L70,120 L30,120 L30,60 C30,40 40,30 50,30 Z" />
            <circle class="head-base" cx="50" cy="20" r="12" />
            <path id="spine-line" class="spine-line" d="M50,35 L50,110" />
          </svg>
        </div>

        <div class="status-pod">
          <div class="status-text" id="status-main">INITIALIZING...</div>
          <div class="zenith-meter">
            <div class="zenith-fill" id="zenith-fill-bar" style="width: 0%;"></div>
          </div>
          <p class="status-hint" id="status-hint">Connecting to necklace sensor...</p>
        </div>
      </div>

      <!-- Right Column -->
      <div class="hud-column">
        <div class="hud-card right" style="margin-bottom: 24px;">
          <span class="card-label">Current Score</span>
          <span class="card-value" id="val-score">--%</span>
        </div>
        <div class="hud-card right">
          <span class="card-label">Live Streak</span>
          <span class="card-value" id="val-streak">--</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Bottom Nav (Mobile) -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="dashboard.html" class="nav-item" data-page="dashboard"><i class="ph ph-house"></i><span>Home</span></a>
    <a href="live-posture.html" class="nav-item active" data-page="live-posture"><i class="ph ph-activity"></i><span>Live</span></a>
    <a href="journey.html" class="nav-item" data-page="journey"><i class="ph ph-trophy"></i><span>Journey</span></a>
    <a href="analytics.html" class="nav-item" data-page="analytics"><i class="ph ph-chart-line-up"></i><span>Insights</span></a>
    <a href="settings.html" class="nav-item" data-page="settings"><i class="ph ph-gear"></i><span>Settings</span></a>
  </nav>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script src="nav.js"></script>
  <script src="tracker.js"></script>

  <script>
    (function() {
      KINEAuth.requireAuth();

      KINEAuth.onReady(user => {
        if (!user) return;

        const silhouette = document.getElementById('silhouette-box');
        const statusText = document.getElementById('status-main');
        const zenithFill = document.getElementById('zenith-fill-bar');
        const statusHint = document.getElementById('status-hint');
        const systemStateText = document.getElementById('system-state-text');

        // Entrance Animation
        anime({
          targets: '.hud-card, .core-module',
          opacity: [0, 1],
          translateY: [20, 0],
          delay: anime.stagger(100),
          easing: 'easeOutExpo'
        });

        // 1. Live Posture Tracking
        KINEdb.onLiveDevicePosture(deviceInfo => {
          if (!deviceInfo) return;

          const isAligned = deviceInfo.isAligned;
          const score = deviceInfo.currentScore || 0;
          
          if (zenithFill) zenithFill.style.width = score + '%';

          if (isAligned) {
            silhouette.classList.remove('deviated');
            statusText.textContent = 'Zenith State';
            statusText.classList.remove('bad');
            statusHint.textContent = `Alignment: Optimal (${(deviceInfo.deviation || 0).toFixed(1)}° dev)`;
            systemStateText.textContent = 'CORE SYSTEM ONLINE — ZENITH';
            document.body.classList.remove('is-slouching');
          } else {
            silhouette.classList.add('deviated');
            statusText.textContent = 'Deviated';
            statusText.classList.add('bad');
            statusHint.textContent = `Alignment: Slouching (${(deviceInfo.deviation || 0).toFixed(1)}° dev)`;
            systemStateText.textContent = 'ALERT: POSTURAL DEVIATION';
            document.body.classList.add('is-slouching');
          }
        });

        // 2. Aggregate Posture Metrics
        KINEdb.onPosture(user.uid, posture => {
          if (!posture) return;
          document.getElementById('val-wear').textContent = (posture.wearTime || 0).toFixed(1) + 'h';
          document.getElementById('val-score').textContent = (posture.currentScore || 100) + '%';
          document.getElementById('val-corrections').textContent = posture.corrections || 0;
          document.getElementById('val-streak').textContent = posture.streak || 0;
        });
      });
    })();
  </script>
</body>
</html>
