<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KINE — Real-time posture tracking and feedback.">
  <title>KINE — Live Posture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app-container">
  <section class="screen active" id="live-posture">
    <div class="screen-header">
      <a href="dashboard.html" class="back-btn"><i class="ph ph-arrow-left"></i> Back</a>
      <h2 class="screen-title">Live Posture</h2>
    </div>

    <div class="posture-focus-container">
      <div class="posture-visual-wrapper">
        <div class="silhouette-container">
          <svg viewBox="0 0 100 150" class="silhouette-svg">
            <path class="body-base" d="M50,30 C60,30 70,40 70,60 L70,120 L30,120 L30,60 C30,40 40,30 50,30 Z" />
            <circle class="head-base" cx="50" cy="20" r="12" />
            <path class="spine-line" d="M50,35 L50,110" />
          </svg>
          <div class="pulse-ring"></div>
        </div>

        <div class="posture-status-card">
          <div class="status-label caption">Current State</div>
          <div class="status-text heading-lg">Initializing...</div>
          <div class="zenith-meter">
            <div class="zenith-fill" style="width: 0%;"></div>
          </div>
          <p class="status-hint">Connecting to necklace sensor...</p>
        </div>
      </div>

      <div class="live-metrics-grid">
        <div class="metric-card card-sm">
          <span class="caption">Wear Time</span>
          <span class="metric-value">--h</span>
        </div>
        <div class="metric-card card-sm">
          <span class="caption">Current Score</span>
          <span class="metric-value">--%</span>
        </div>
        <div class="metric-card card-sm">
          <span class="caption">Corrections</span>
          <span class="metric-value">--</span>
        </div>
      </div>
    </div>
  </section>
</main>

</nav>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="db.js"></script>
  <script src="tracker.js"></script>
  <script src="nav.js"></script>

  <script>
    (function() {
      KINEAuth.requireAuth();

      KINEAuth.onReady(user => {
        if (!user) return;

        const silhouette = document.querySelector('.silhouette-container');
        const statusText = document.querySelector('.status-text');
        const zenithFill = document.querySelector('.zenith-fill');
        const statusHint = document.querySelector('.status-hint');
        const metricValues = document.querySelectorAll('.metric-value');

        // 1. Live Posture Tracking (UI update only, logging handled by tracker.js)
        KINEdb.onLiveDevicePosture(deviceInfo => {
          console.log('[Live] deviceInfo received:', deviceInfo);
          if (!silhouette || !statusText) return;

          const isAligned = deviceInfo.isAligned;
          const score = deviceInfo.currentScore || 0;
          
          if (zenithFill) zenithFill.style.width = score + '%';

          if (isAligned) {
            silhouette.classList.remove('deviated');
            silhouette.classList.add('zenith-glow');
            statusText.textContent = 'Zenith State';
            statusText.classList.remove('bad');
            statusHint.textContent = `Alignment: Optimal (${(deviceInfo.deviation || 0).toFixed(1)}° dev)`;
          } else {
            silhouette.classList.remove('zenith-glow');
            silhouette.classList.add('deviated');
            statusText.textContent = 'Deviated';
            statusText.classList.add('bad');
            statusHint.textContent = `Alignment: Slouching (${(deviceInfo.deviation || 0).toFixed(1)}° dev)`;
          }
        });

        // 2. Aggregate Posture Metrics
        KINEdb.onPosture(user.uid, posture => {
          console.log('[Live] Global posture stats received:', posture);
          if (!posture || metricValues.length < 3) return;

          metricValues[0].textContent = (posture.wearTime || 0).toFixed(1) + 'h';
          metricValues[1].textContent = (posture.currentScore || 100) + '%';
          metricValues[2].textContent = posture.corrections || 0;
        });
      });
    })();
  </script>
</body>
</html>
