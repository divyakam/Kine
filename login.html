<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KINE — Log in to continue your posture journey.">
  <title>KINE — Log In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app-container">
  <section class="screen active" id="log-in">
    <div class="auth-card glass">
      <h2 class="heading-lg">Welcome Back</h2>
      <p class="auth-subtitle">Log in to continue your journey.</p>
      <form id="login-form">
        <div class="input-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="input-field" placeholder="alex@email.com" required>
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="input-field" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block btn-lg">Log In</button>
      </form>
      <div style="text-align:center;margin-top:12px;">
        <a href="forgot-password.html" style="color:var(--accent-primary);font-weight:600;font-size:0.85rem;">Forgot Password?</a>
      </div>
      <p class="auth-footer">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
  </section>
</main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      const btn = document.getElementById('login-btn');
      btn.classList.add('btn-loading');
      btn.disabled = true;

      try {
        await KINEAuth.logIn(email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        console.error(error);
      } finally {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    });

    // Note: Auto-redirect removed so the user is always asked to log in 
    // when they explicitly navigate to this screen.
    // KINEAuth.onReady(user => {
    //   if (user) {
    //     window.location.href = 'dashboard.html';
    //   }
    // });
  </script>
</body>
</html>
