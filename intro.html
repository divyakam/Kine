<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KINE — Get started with your smart posture-correcting necklace.">
  <title>KINE — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="splash.js" defer></script>
  <style>
    body {
      background: var(--bg-primary);
      overflow: hidden;
      margin: 0;
    }

    .bg-glows {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .glow-orb {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
    }

    .glow-1 { top: -20%; left: -10%; background: var(--accent-primary); }
    .glow-2 { bottom: -20%; right: -10%; background: var(--accent-secondary); }

    .intro-container {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      opacity: 0;
    }

    .intro-card {
      max-width: 500px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 40px;
      padding: 48px;
      backdrop-filter: blur(20px);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }

    .intro-visual {
      width: 100px;
      height: 100px;
      background: rgba(129, 236, 255, 0.1);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--accent-primary);
      position: relative;
    }

    .intro-visual::after {
      content: '';
      position: absolute;
      inset: -10px;
      border: 1px solid rgba(129, 236, 255, 0.2);
      border-radius: 35px;
      animation: rotate-slow 10s linear infinite;
    }

    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .intro-content h2 {
      font-size: 2rem;
      color: #fff;
      margin-bottom: 16px;
    }

    .intro-content p {
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 1.1rem;
    }

    .intro-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>

<body>

  <div class="bg-glows">
    <div class="glow-orb glow-1"></div>
    <div class="glow-orb glow-2"></div>
  </div>
  <div class="grid-overlay"></div>

  <main id="app-container">
    <div class="intro-container" id="intro-content">
      <div class="intro-card">
        <div class="intro-visual">
          <i class="ph ph-shield-check"></i>
        </div>
        
        <div class="intro-content">
          <h2 class="heading-lg">Your Posture, Perfected</h2>
          <p class="body-lg">Join the thousands of users improving their spinal health with KINE's intelligent biometric feedback.</p>
        </div>

        <div class="intro-actions">
          <a href="signup.html" class="btn btn-primary btn-block btn-lg">Create Account</a>
          <a href="login.html" class="btn btn-ghost btn-block">Log In</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    window.onload = () => {
      if (window.KINESplash && window.KINESplash.finished) {
        startIntroAnimations();
      } else {
        window.addEventListener('KINESplashFinished', () => {
          startIntroAnimations();
        });
      }
    };

    function startIntroAnimations() {
      anime({
        targets: '.intro-container',
        opacity: [0, 1],
        translateY: [30, 0],
        duration: 1200,
        easing: 'easeOutExpo'
      });

      anime({
        targets: '.intro-card',
        scale: [0.95, 1],
        duration: 1500,
        easing: 'easeOutElastic(1, .8)'
      });
    }
  </script>
</body>

</html>
