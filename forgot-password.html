<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KINE — Reset your password.">
  <title>KINE — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app-container">
  <section class="screen active" id="forgot-password">
    <div class="auth-card glass">
      <a href="login.html" class="back-btn"><i class="ph ph-arrow-left"></i> Back</a>
      <h2 class="heading-lg">Reset Password</h2>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>
      <div class="input-group">
        <label for="reset-email">Email</label>
        <input type="email" id="reset-email" class="input-field" placeholder="alex@email.com">
      </div>
      <button class="btn btn-primary btn-block btn-lg" data-navigate="log-in">Send Reset Link</button>
    </div>
  </section>
</main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>

  <script>
    document.querySelector('button[data-navigate="log-in"]').addEventListener('click', async function(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;

      if (!email) {
        KINEAuth.showToast('Please enter your email', 'error');
        return;
      }

      const btn = this;
      btn.classList.add('btn-loading');
      btn.disabled = true;

      try {
        await KINEAuth.resetPassword(email);
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (error) {
        console.error(error);
      } finally {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
